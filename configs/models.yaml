# LLM assignments (DESIGN.md §4). Single provider: OpenRouter (OpenAI-compatible /v1).
# Agents (A, B) and Detector -> Qwen-72B.  Judge -> GPT-4o-mini.
# One base_url + one key (OPENROUTER_API_KEY); roles differ only by model slug.
# Verify exact slugs on https://openrouter.ai/models (they occasionally change).
#
# Both bidders (A and B) use this single `agent` config -- "two independent instances of the
# same model" per the methodology; independence is just separate calls with private costs.

agent:
  model: "qwen/qwen-2.5-72b-instruct"
  base_url: "https://openrouter.ai/api/v1"
  api_key_env: "OPENROUTER_API_KEY"
  temperature: 0.7
  max_tokens: 1024
  timeout: 60
  max_retries: 3

detector:
  model: "qwen/qwen-2.5-72b-instruct"
  base_url: "https://openrouter.ai/api/v1"
  api_key_env: "OPENROUTER_API_KEY"
  temperature: 0.2
  max_tokens: 1024
  timeout: 60
  max_retries: 3

judge:
  model: "openai/gpt-4o-mini"
  base_url: "https://openrouter.ai/api/v1"
  api_key_env: "OPENROUTER_API_KEY"
  temperature: 0.0
  max_tokens: 1024
  timeout: 60
  max_retries: 3

# Optional OpenRouter ranking headers (add under any role if you want attribution):
#   extra_headers:
#     HTTP-Referer: "https://your-project-url"
#     X-Title: "collusion-study"
