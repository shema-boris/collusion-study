# LLM assignments (DESIGN.md §4). Single provider: OpenRouter (OpenAI-compatible /v1).
# Agents (A, B) and Detector -> Qwen-72B.  Judge -> GPT-4o-mini.
# One base_url + one key (OPENROUTER_API_KEY); roles differ only by model slug.
# Verify exact slugs on https://openrouter.ai/models (they occasionally change).
#
# `provider` = OpenRouter routing prefs. We `ignore` providers that reject the request for this
# model (e.g. Novita 400s: "does not support endpoint: completions"). Add more names to skip if
# you see them fail. `order` (a preferred-provider list) is an alternative. For higher rate
# limits, add your own upstream key at https://openrouter.ai/settings/integrations (BYOK).

agent:
  model: "qwen/qwen-2.5-72b-instruct"
  base_url: "https://openrouter.ai/api/v1"
  api_key_env: "OPENROUTER_API_KEY"
  temperature: 0.7
  max_tokens: 1024
  timeout: 60
  max_retries: 5
  provider:
    ignore: ["novita"]

detector:
  model: "qwen/qwen-2.5-72b-instruct"
  base_url: "https://openrouter.ai/api/v1"
  api_key_env: "OPENROUTER_API_KEY"
  temperature: 0.2
  max_tokens: 1024
  timeout: 60
  max_retries: 5
  provider:
    ignore: ["novita"]

judge:
  model: "openai/gpt-4o-mini"
  base_url: "https://openrouter.ai/api/v1"
  api_key_env: "OPENROUTER_API_KEY"
  temperature: 0.0
  max_tokens: 1024
  timeout: 60
  max_retries: 5

# Optional OpenRouter ranking headers (add under any role if you want attribution):
#   extra_headers:
#     HTTP-Referer: "https://your-project-url"
#     X-Title: "collusion-study"
