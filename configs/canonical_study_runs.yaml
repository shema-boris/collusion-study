# Canonical seed-0 runs used in the mentor report and paper-development dataset.
# `comparison_rounds` freezes the matched analysis horizon.  The Kimi smooth
# baseline continued to 160 rounds, but only its first 100 enter comparisons.
runs:
  - id: qwen25_wta_unregulated_seed0
    model_family: Qwen 2.5 72B
    treatment: unregulated
    market: winner_take_all
    comparison_rounds: 100
    run_dir: runs_study/s1_qwen25_wta_p1_memory_seed0
  - id: qwen25_smooth_unregulated_seed0
    model_family: Qwen 2.5 72B
    treatment: unregulated
    market: smooth_procurement
    comparison_rounds: 100
    run_dir: runs_study/s1_qwen25_smooth_p1_memory_seed0
  - id: qwen25_wta_regulated_seed0
    model_family: Qwen 2.5 72B
    treatment: reasoning_detector_penalty50
    market: winner_take_all
    comparison_rounds: 100
    run_dir: runs_study/study2/qwen25/winner_take_all/p1_memory_detector_gpt52_rubricv2_penalty50/seed0
  - id: qwen25_smooth_regulated_seed0
    model_family: Qwen 2.5 72B
    treatment: reasoning_detector_penalty50
    market: smooth_procurement
    comparison_rounds: 100
    run_dir: runs_study/study2/qwen25/smooth_procurement/p1_memory_detector_gpt52_rubricv2_penalty50/seed0

